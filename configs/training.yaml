model: Qwen/Qwen3-ASR-1.7B-hf          # primary (Apache-2.0, June 2026); Whisper kept as the previous-generation baseline
fallback_model: Qwen/Qwen3-ASR-0.6B-hf
legacy_model: openai/whisper-large-v3-turbo
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  whisper_target_modules: [q_proj, k_proj, v_proj, out_proj, fc1, fc2, proj_out]
  # Qwen targets (regex in scripts/train.py): language-model attn+MLP, audio-tower attention, projector
epochs: 3
learning_rate: 1.0e-4
batch_size: 16
gradient_accumulation: 2
max_audio_seconds: 20
target_mode: canonical
warmup_steps: 100
augment: 0.5          # prob. of gain/noise augmentation per training clip
seed: 1234
bf16: true
