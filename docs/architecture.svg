<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker>
<style>.b{fill:#f4f6fb;stroke:#4a5a8a;stroke-width:1.5;rx:8}.g{fill:#eef8ee;stroke:#3a7d3a;stroke-width:1.5;rx:8}.o{fill:#fff4e5;stroke:#b8741a;stroke-width:1.5;rx:8}.r{fill:#fdecec;stroke:#a33;stroke-width:1.5;rx:8}.t{fill:#222}.s{fill:#666;font-size:11px}.l{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}</style></defs>
<text x="490" y="26" text-anchor="middle" font-size="18" font-weight="600" class="t">MathSpeech – data → training → inference</text>
<!-- data -->
<rect class="b" x="20" y="50" width="210" height="64"/><text x="125" y="75" text-anchor="middle" class="t" font-weight="600">Grammar: 68 templates + random trees</text><text x="125" y="95" text-anchor="middle" class="s">LaTeX = source of truth + spoken text</text>
<rect class="b" x="20" y="140" width="210" height="64"/><text x="125" y="165" text-anchor="middle" class="t" font-weight="600">Kokoro-82M TTS</text><text x="125" y="185" text-anchor="middle" class="s">16 voices · speed · pitch aug · 16 kHz</text>
<rect class="o" x="20" y="230" width="210" height="76"/><text x="125" y="255" text-anchor="middle" class="t" font-weight="600">Real audio pipeline</text><text x="125" y="274" text-anchor="middle" class="s">HF streaming → ASR → math detect</text><text x="125" y="291" text-anchor="middle" class="s">→ canonicalize → strict filters</text>
<rect class="g" x="20" y="332" width="210" height="64"/><text x="125" y="357" text-anchor="middle" class="t" font-weight="600">HF DatasetDict</text><text x="125" y="377" text-anchor="middle" class="s">train / val / test / test_hard (LaTeX-hash split)</text>
<path class="l" d="M125,114 V140"/><path class="l" d="M125,204 V332"/><path class="l" d="M125,306 V332"/>
<!-- training -->
<rect class="b" x="300" y="140" width="250" height="90"/><text x="425" y="166" text-anchor="middle" class="t" font-weight="600">Qwen3-ASR-1.7B + LoRA</text><text x="425" y="186" text-anchor="middle" class="s">r=32 on LLM attn+MLP, audio-encoder attn, projector</text><text x="425" y="204" text-anchor="middle" class="s">target = canonical LaTeX · 1 × H100 · 25 min</text><text x="425" y="220" text-anchor="middle" class="s">W&amp;B logging · resumable checkpoints</text>
<path class="l" d="M230,364 H265 V185 H300"/>
<!-- inference -->
<rect class="r" x="620" y="50" width="330" height="70"/><text x="785" y="76" text-anchor="middle" class="t" font-weight="600">A. Generic Qwen3-ASR (zero-shot)</text><text x="785" y="97" text-anchor="middle" class="s">"…from zero to pie of x squared…"</text>
<rect class="o" x="620" y="140" width="330" height="70"/><text x="785" y="166" text-anchor="middle" class="t" font-weight="600">C. Generic + rule/LLM normaliser</text><text x="785" y="187" text-anchor="middle" class="s">lexicon · parser · validity filters · optional LLM fallback</text>
<rect class="g" x="620" y="230" width="330" height="70"/><text x="785" y="256" text-anchor="middle" class="t" font-weight="600">B. MathSpeech (fine-tuned, direct)</text><text x="785" y="277" text-anchor="middle" class="s">\int_0^\pi x^2\,dx</text>
<rect class="b" x="620" y="330" width="330" height="70"/><text x="785" y="356" text-anchor="middle" class="t" font-weight="600">Gradio demo + report · LaTeX → Unicode text</text><text x="785" y="377" text-anchor="middle" class="s">3 systems side by side · KaTeX + plain-text</text>
<path class="l" d="M550,185 H585 V85 H620"/><path class="l" d="M585,175 H620"/><path class="l" d="M550,185 H585 V265 H620"/><path class="l" d="M785,300 V330"/>
<rect class="b" x="300" y="300" width="250" height="64"/><text x="425" y="326" text-anchor="middle" class="t" font-weight="600">Metrics</text><text x="425" y="345" text-anchor="middle" class="s">WER · exact · token-edit · symbol/Greek/op/script/bracket</text>
<path class="l" d="M550,330 H620 "/>
<text x="490" y="440" text-anchor="middle" class="s">Evaluation-only probe: AAAI2025/MathSpeech (real human speech, licence undeclared → never trained on, aggregate metrics only)</text>
</svg>
